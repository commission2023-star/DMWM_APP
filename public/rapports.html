<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rapports — DMWM UASZ</title>
<link href="/css/bootstrap.min.css" rel="stylesheet">
<link href="/css/fontawesome.min.css" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#f0f4f8; font-family:'Segoe UI',sans-serif; }
.card-custom { background:white; border-radius:15px; box-shadow:0 2px 15px rgba(0,0,0,0.06); border:none; padding:25px; margin-bottom:20px; }
.form-control, .form-select { border:2px solid #e0e0e0; border-radius:8px; padding:8px 12px; font-size:0.88rem; }
.btn-export-pdf { background:linear-gradient(135deg,#dc3545,#ff6b6b); border:none; color:white; }
.btn-export-excel { background:linear-gradient(135deg,#28a745,#20c997); border:none; color:white; }
.chart-container { position:relative; height:300px; }
.classement-item { display:flex; align-items:center; justify-content:space-between; padding:10px 12px; border-radius:8px; margin-bottom:6px; background:#f8f9fa; }
.rang-badge { width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:0.8rem; color:white; flex-shrink:0; }
</style>
</head>
<body>
<script src="/js/auth-guard.js"></script>
<script src="/js/sidebar.js"></script>

<div class="page-wrapper">
  <div class="topbar-page">
    <div class="d-flex align-items-center gap-3">
      <button class="btn-hamburger" onclick="toggleSidebar()" title="Ouvrir le menu" aria-label="Ouvrir le menu"><i class="fas fa-bars"></i></button>
      <h5><i class="fas fa-file-alt me-2"></i>Rapports et statistiques</h5>
    </div>
  </div>

  <div style="padding:25px;flex:1;">
  <div id="alerte" class="alert d-none mb-3"></div>

  <div class="card-custom">
    <h6 class="fw-bold text-primary mb-3"><i class="fas fa-filter me-2"></i>Filtres du rapport</h6>
    <div class="row g-3 align-items-end">
      <div class="col-md-3"><label class="form-label small fw-bold" for="filtreMois">Mois</label><input type="month" class="form-control" id="filtreMois" aria-label="Mois"></div>
      <div class="col-md-3"><label class="form-label small fw-bold" for="filtreType">Type de programme</label>
        <select class="form-select" id="filtreType" aria-label="Type de programme"><option value="">Tous</option><option value="Goudy Aldiouma">Goudy Aldiouma</option><option value="Xadara">Xadara</option><option value="Enseignement">Enseignement</option><option value="Autre">Autre</option></select></div>
      <div class="col-md-2"><label class="form-label small fw-bold" for="filtreSexe">Sexe</label>
        <select class="form-select" id="filtreSexe" aria-label="Sexe"><option value="">H + F</option><option value="H">Hommes</option><option value="F">Femmes</option></select></div>
      <div class="col-md-2"><label class="form-label small fw-bold" for="filtreCommission">Commission</label>
        <select class="form-select" id="filtreCommission" aria-label="Commission"><option value="">Toutes</option><option value="PF">PF</option><option value="CA">CA</option><option value="CIPS">CIPS</option><option value="CTC">CTC</option><option value="CL">CL</option><option value="Membre simple">Membres simples</option></select></div>
      <div class="col-md-2"><button class="btn btn-outline-primary w-100" onclick="chargerStatistiques()"><i class="fas fa-sync me-1"></i>Actualiser</button></div>
    </div>
    <div class="d-flex gap-2 mt-3">
      <button class="btn btn-export-pdf" onclick="exporterPDF()"><i class="fas fa-file-pdf me-2"></i>Exporter en PDF</button>
      <button class="btn btn-export-excel" onclick="exporterExcel()"><i class="fas fa-file-excel me-2"></i>Exporter en Excel</button>
    </div>
  </div>

  <div class="row g-4">
    <div class="col-md-6"><div class="card-custom"><h6 class="fw-bold text-primary mb-3"><i class="fas fa-chart-line me-2"></i>Taux de présence par programme</h6><div class="chart-container"><canvas id="chartTaux"></canvas></div></div></div>
    <div class="col-md-6"><div class="card-custom"><h6 class="fw-bold text-primary mb-3"><i class="fas fa-chart-pie me-2"></i>Répartition présents / absents</h6><div class="chart-container"><canvas id="chartRepartition"></canvas></div></div></div>
    <div class="col-md-6"><div class="card-custom"><h6 class="fw-bold text-primary mb-3"><i class="fas fa-venus-mars me-2"></i>Comparaison Hommes / Femmes</h6><div class="chart-container"><canvas id="chartHF"></canvas></div></div></div>
    <div class="col-md-6"><div class="card-custom"><h6 class="fw-bold text-primary mb-3"><i class="fas fa-user-plus me-2"></i>Évolution nouveaux adhérents</h6><div class="chart-container"><canvas id="chartEvolution"></canvas></div></div></div>
  </div>

  <div class="card-custom">
    <h6 class="fw-bold text-primary mb-3"><i class="fas fa-trophy me-2"></i>Classement des membres les plus assidus</h6>
    <div id="classementMembres"><div class="text-center text-muted py-3">Chargement...</div></div>
  </div>
  </div>
</div>

<script src="/js-libs/bootstrap.bundle.min.js"></script>
<script src="/js-libs/chart.umd.min.js"></script>
<script>
  const token = window.authToken;
  let charts = {};

  function getFiltres() {
    return { mois: document.getElementById('filtreMois').value, type_programme: document.getElementById('filtreType').value,
             sexe: document.getElementById('filtreSexe').value, commission: document.getElementById('filtreCommission').value };
  }
  function buildParams(f) { const p = new URLSearchParams(); Object.entries(f).forEach(([k, v]) => { if (v) p.append(k, v); }); return p; }

  async function chargerStatistiques() {
    try {
      const res = await fetch(`/api/rapports/statistiques?${buildParams(getFiltres())}`, { headers: { Authorization: `Bearer ${token}` } });
      if (!res.ok) { afficherAlerte('Accès refusé ou erreur serveur.', 'danger'); return; }
      const data = await res.json();
      dessinerChartTaux(data.tauxParProgramme); dessinerChartRepartition(data.repartitionType);
      dessinerChartHF(data.comparaisonHF); dessinerChartEvolution(data.evolutionNouveaux); afficherClassement(data.classement);
    } catch(e) { afficherAlerte('Erreur lors du chargement des statistiques.', 'danger'); }
  }

  function detruireChart(nom) { if (charts[nom]) charts[nom].destroy(); }

  function dessinerChartTaux(donnees) {
    detruireChart('taux');
    charts.taux = new Chart(document.getElementById('chartTaux'), {
      type: 'line',
      data: { labels: donnees.map(d => new Date(d.date).toLocaleDateString('fr-FR', { day:'2-digit', month:'2-digit' })),
              datasets: [{ label: 'Taux de présence (%)', data: donnees.map(d => d.taux), borderColor: '#1B5E8A', backgroundColor: 'rgba(27,94,138,0.1)', tension: 0.3, fill: true }] },
      options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, max: 100 } } }
    });
  }
  function dessinerChartRepartition(donnees) {
    detruireChart('repartition');
    const types = Object.keys(donnees);
    charts.repartition = new Chart(document.getElementById('chartRepartition'), {
      type: 'bar',
      data: { labels: types, datasets: [ { label: 'Présents', data: types.map(t => donnees[t].presents), backgroundColor: '#28a745' }, { label: 'Absents', data: types.map(t => donnees[t].absents), backgroundColor: '#dc3545' } ] },
      options: { responsive: true, maintainAspectRatio: false, scales: { x: { stacked: true }, y: { stacked: true } } }
    });
  }
  function dessinerChartHF(d) {
    detruireChart('hf');
    charts.hf = new Chart(document.getElementById('chartHF'), {
      type: 'doughnut',
      data: { labels: [`Hommes (${d.hommes.taux}%)`, `Femmes (${d.femmes.taux}%)`], datasets: [{ data: [d.hommes.presents, d.femmes.presents], backgroundColor: ['#2196F3', '#e91e63'] }] },
      options: { responsive: true, maintainAspectRatio: false }
    });
  }
  function dessinerChartEvolution(donnees) {
    detruireChart('evolution');
    charts.evolution = new Chart(document.getElementById('chartEvolution'), {
      type: 'bar',
      data: { labels: donnees.map(d => { const [an, m] = d.mois.split('-'); return new Date(an, m-1).toLocaleDateString('fr-FR', { month:'short', year:'2-digit' }); }),
              datasets: [{ label: 'Nouveaux adhérents', data: donnees.map(d => d.count), backgroundColor: '#fd7e14', borderRadius: 6 }] },
      options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } }
    });
  }
  function afficherClassement(classement) {
    const c = document.getElementById('classementMembres');
    if (classement.length === 0) { c.innerHTML = '<p class="text-muted text-center">Aucune donnée de présence disponible</p>'; return; }
    const medailles = ['#FFD700', '#C0C0C0', '#CD7F32'];
    c.innerHTML = classement.map((m, i) => `
      <div class="classement-item">
        <div class="d-flex align-items-center gap-3"><div class="rang-badge" style="background:${i<3?medailles[i]:'#6c757d'}">${i+1}</div><span class="fw-bold">${m.nom}</span></div>
        <div class="d-flex align-items-center gap-3"><span class="text-muted small">${m.presents}/${m.total}</span><span class="badge bg-primary">${m.taux}%</span></div>
      </div>`).join('');
  }

  async function telecharger(type, extension, label) {
    try {
      const res = await fetch(`/api/rapports/${type}?${buildParams(getFiltres())}`, { headers: { Authorization: `Bearer ${token}` } });
      if (!res.ok) { afficherAlerte(`Erreur lors de la génération du ${label}.`, 'danger'); return; }
      const blob = await res.blob();
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `rapport_dmwm_${getFiltres().mois || 'complet'}.${extension}`;
      document.body.appendChild(a); a.click(); a.remove();
      afficherAlerte(`Rapport ${label} téléchargé avec succès !`, 'success');
    } catch(e) { afficherAlerte('Erreur serveur.', 'danger'); }
  }
  function exporterPDF() { telecharger('pdf', 'pdf', 'PDF'); }
  function exporterExcel() { telecharger('excel', 'xlsx', 'Excel'); }

  function afficherAlerte(msg, type) {
    const a = document.getElementById('alerte');
    a.className = `alert alert-${type}`;
    a.innerHTML = `<i class="fas fa-${type==='success'?'check':'exclamation'}-circle me-2"></i>${msg}`;
    a.classList.remove('d-none'); setTimeout(() => a.classList.add('d-none'), 4000);
  }
  chargerStatistiques();
</script>
</body>
</html>
