<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    try {
      var t = localStorage.getItem('dmwm-theme');
      document.documentElement.dataset.theme = t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    } catch (e) {}
  </script>
  <title>Tableau de bord — DMWM UASZ</title>
  <link href="/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/commun.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#6d28d9">
  <link rel="icon" type="image/png" href="/images/icon-192.png">
  <script src="/js-libs/lucide.min.js" defer></script>
  <script src="/js/icons.js" defer></script>
  <script src="/js/theme.js" defer></script>
  <script src="/js/pwa.js" defer></script>
</head>
<body>
<script src="/js/auth-guard.js"></script>
<script src="/js/sidebar.js"></script>

<div class="page-wrapper">

  <div class="topbar-page">
    <div class="d-flex align-items-center gap-2">
      <button class="btn-hamburger" onclick="toggleSidebar()" title="Ouvrir le menu" aria-label="Ouvrir le menu">
        <i data-lucide="menu"></i>
      </button>
      <h5><i data-lucide="layout-dashboard"></i>Tableau de bord</h5>
    </div>
    <div class="topbar-actions">
      <span id="badgeRole" class="badge"></span>
    </div>
  </div>

  <div style="padding:25px;flex:1;">

    <div class="bienvenue">
      <p class="bienvenue-eyebrow">Espace de gestion</p>
      <h4>Bienvenue, <span id="nomUser"></span></h4>
      <p id="messageRole"></p>
    </div>

    <div class="row g-3 g-md-4 mb-4">
      <div class="col-6 col-md-3">
        <div class="stat-card">
          <div class="d-flex justify-content-between align-items-start">
            <div>
              <div class="stat-number" id="dTotal">—</div>
              <div class="stat-label">Total membres</div>
            </div>
            <div class="stat-icon"><i data-lucide="users"></i></div>
          </div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="stat-card">
          <div class="d-flex justify-content-between align-items-start">
            <div>
              <div class="stat-number" id="dNouveaux">—</div>
              <div class="stat-label">Nouveaux</div>
            </div>
            <div class="stat-icon green"><i data-lucide="user-plus"></i></div>
          </div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="stat-card">
          <div class="d-flex justify-content-between align-items-start">
            <div>
              <div class="stat-number" id="dInscriptions">—</div>
              <div class="stat-label">Inscriptions en attente</div>
            </div>
            <div class="stat-icon amber"><i data-lucide="clock"></i></div>
          </div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="stat-card">
          <div class="d-flex justify-content-between align-items-start">
            <div>
              <div class="stat-number"><span id="dHommes">—</span> / <span id="dFemmes">—</span></div>
              <div class="stat-label">Hommes / Femmes</div>
            </div>
            <div class="stat-icon rose"><i data-lucide="venus-and-mars"></i></div>
          </div>
        </div>
      </div>
    </div>

    <div class="row g-3 g-md-4">
      <div class="col-md-6">
        <div class="card-info">
          <div class="section-head">
            <h6><i data-lucide="calendar-check"></i>Prochains événements</h6>
            <span class="compte">5 max.</span>
          </div>
          <div id="prochainProg">
            <div class="empty-state">
              <i data-lucide="loader-circle" class="icon-spin"></i>
              <span>Chargement...</span>
            </div>
          </div>
        </div>
      </div>
      <div class="col-md-6">
        <div class="card-info">
          <div class="section-head">
            <h6><i data-lucide="triangle-alert"></i>Membres à contacter
              <span class="badge bg-danger" id="badgeAbsents" style="display:none;"></span>
            </h6>
          </div>
          <div id="membresAbsents">
            <div class="empty-state">
              <i data-lucide="loader-circle" class="icon-spin"></i>
              <span>Chargement...</span>
            </div>
          </div>
          <a href="/absences.html" class="btn btn-outline-warning btn-sm mt-3 w-100" id="lienAbsents">
            <i data-lucide="user-x"></i>Voir tous les absents
          </a>
        </div>
      </div>
    </div>

  </div>
</div>

<script src="/js-libs/bootstrap.bundle.min.js"></script>
<script>
  const token = window.authToken;
  const user = window.currentUser;

  const ROLES_REUNIONS = ['Super Admin', 'Admin CA', 'PF', 'CIPS', 'CTC', 'CL'];
  const ROLES_ABSENTS = ['Super Admin', 'Admin CA', 'PF'];
  const peutVoirReunions = ROLES_REUNIONS.includes(user.role);
  const peutVoirAbsents = ROLES_ABSENTS.includes(user.role);

  document.getElementById('nomUser').textContent = user.nom || '';

  const messages = {
    'Super Admin': 'Vous avez accès complet à toutes les fonctionnalités.',
    'Admin CA': 'Gérez les membres, pointages et communications du Conseil.',
    'Agent H': 'Vous pouvez effectuer le pointage des membres hommes.',
    'Agent F': 'Vous pouvez effectuer le pointage des membres femmes.',
    'PF': 'Supervisez les activités des commissions du Conseil.',
    'CIPS': 'Gérez les activités pédagogiques et spirituelles.',
    'CTC': 'Gérez les ressources et la capacitation.',
    'CL': 'Gérez la logistique des programmes.'
  };
  document.getElementById('messageRole').textContent = messages[user.role] || '';

  const badge = document.getElementById('badgeRole');
  badge.textContent = user.role;

  async function api(url, secours) {
    const res = await fetch(url, { headers: { Authorization: `Bearer ${token}` } });
    if (!res.ok) return secours;
    try { return await res.json(); } catch (e) { return secours; }
  }

  function initiales(prenom, nom) {
    return `${(prenom || '?')[0]}${(nom || '?')[0]}`.toUpperCase();
  }

  async function chargerStats() {
    try {
      const [m, ins, programmes, reunions] = await Promise.all([
        api('/api/membres/stats', {}),
        api('/api/inscriptions/stats', {}),
        api('/api/programmes?statut=Planifie', []),
        peutVoirReunions ? api('/api/reunions', []) : Promise.resolve([])
      ]);

      document.getElementById('dTotal').textContent = m.total || 0;
      document.getElementById('dNouveaux').textContent = m.nouveaux || 0;
      document.getElementById('dHommes').textContent = m.hommes || 0;
      document.getElementById('dFemmes').textContent = m.femmes || 0;
      document.getElementById('dInscriptions').textContent = ins.enAttente || 0;

      const aujourd_hui = new Date();
      aujourd_hui.setHours(0, 0, 0, 0);

      const prochainsProg = (Array.isArray(programmes) ? programmes : [])
        .filter(p => new Date(p.date + 'T00:00:00') >= aujourd_hui)
        .map(p => ({
          type: 'programme', label: p.type, date: p.date,
          heure_debut: p.heure_debut, heure_fin: p.heure_fin,
          lieu: p.lieu, oustaze: p.oustaze
        }));

      const prochainesReunions = (Array.isArray(reunions) ? reunions : [])
        .filter(r => new Date(r.date + 'T00:00:00') >= aujourd_hui)
        .map(r => ({
          type: 'reunion', label: 'Réunion du Conseil', date: r.date,
          heure_debut: r.heure_debut, heure_fin: r.heure_fin,
          lieu: r.lieu, nb_cr: r.CompteRendus?.length || 0
        }));

      const tousEvenements = [...prochainsProg, ...prochainesReunions]
        .sort((a, b) => new Date(a.date) - new Date(b.date))
        .slice(0, 5);

      const divProg = document.getElementById('prochainProg');

      if (tousEvenements.length === 0) {
        divProg.innerHTML = `
          <div class="empty-state">
            <i data-lucide="calendar-x"></i>
            <span>Aucun événement planifié prochainement</span>
          </div>`;
      } else {
        const couleursType = {
          'Goudy Aldiouma': 'primary', 'Xadara': 'info',
          'Enseignement': 'success', 'Autre': 'warning', 'reunion': 'danger'
        };

        divProg.innerHTML = tousEvenements.map(e => {
          const date = new Date(e.date + 'T00:00:00').toLocaleDateString('fr-FR', {
            weekday: 'short', day: 'numeric', month: 'short'
          });
          const couleur = e.type === 'reunion' ? 'danger' : (couleursType[e.label] || 'secondary');
          const icone = e.type === 'reunion' ? 'handshake' : 'calendar-check';

          return `
            <div class="event-row">
              <div class="d-flex align-items-center justify-content-between gap-2">
                <span class="badge bg-${couleur}">
                  <i data-lucide="${icone}"></i>${e.label}
                </span>
                <span class="event-date">${date}</span>
              </div>
              <div class="event-meta">
                ${e.heure_debut ? `<span><i data-lucide="clock"></i>${e.heure_debut.substring(0,5)}${e.heure_fin ? ' – ' + e.heure_fin.substring(0,5) : ''}</span>` : ''}
                ${e.lieu ? `<span><i data-lucide="map-pin"></i>${e.lieu}</span>` : ''}
                ${e.oustaze ? `<span><i data-lucide="user"></i>${e.oustaze}</span>` : ''}
                ${e.type === 'reunion' ? `<span class="badge bg-light text-dark">${e.nb_cr} CR</span>` : ''}
              </div>
            </div>`;
        }).join('');
      }
    } catch (e) {
      console.log('Erreur stats:', e);
    }

    if (window.rafraichirIcones) window.rafraichirIcones();
    chargerAbsents();
  }

  async function chargerAbsents() {
    const div = document.getElementById('membresAbsents');
    const lien = document.getElementById('lienAbsents');

    if (!peutVoirAbsents) {
      if (lien) lien.style.display = 'none';
      div.innerHTML = `
        <div class="empty-state">
          <i data-lucide="lock"></i>
          <span>Section réservée à la CA et aux PF.</span>
        </div>`;
      if (window.rafraichirIcones) window.rafraichirIcones();
      return;
    }

    try {
      const absents = await api('/api/pointage/absents-recurrents', []);
      const badgeAbsents = document.getElementById('badgeAbsents');

      if (!Array.isArray(absents) || absents.length === 0) {
        div.innerHTML = `
          <div class="empty-state success">
            <i data-lucide="circle-check"></i>
            <span>Aucun membre avec 2 absences consécutives ou plus</span>
          </div>`;
        if (window.rafraichirIcones) window.rafraichirIcones();
        return;
      }

      badgeAbsents.textContent = absents.length;
      badgeAbsents.style.display = 'inline-block';

      div.innerHTML = absents.slice(0, 4).map(m => {
        const couleur = m.absences_consecutives >= 4 ? 'danger' :
                        m.absences_consecutives >= 3 ? 'warning' : 'secondary';
        return `
          <div class="absent-row">
            <div class="d-flex align-items-center gap-2">
              <div class="avatar-sm" style="background:linear-gradient(135deg,#ef4444,#f97316)">
                ${initiales(m.prenom, m.nom)}
              </div>
              <div>
                <div class="absent-name">${m.prenom} ${m.nom}</div>
                <div class="absent-tel">${m.telephone || '—'}</div>
              </div>
            </div>
            <span class="badge bg-${couleur}">${m.absences_consecutives}×</span>
          </div>`;
      }).join('');

      if (absents.length > 4) {
        div.innerHTML += `<div class="text-center text-muted small mt-1">+ ${absents.length - 4} autre(s)</div>`;
      }
      if (window.rafraichirIcones) window.rafraichirIcones();
    } catch (e) {
      div.innerHTML = '<div class="empty-state"><span>Disponible après le premier pointage</span></div>';
    }
  }

  chargerStats();
</script>
</body>
</html>
