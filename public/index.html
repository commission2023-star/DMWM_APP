<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DMWM — Conseil UASZ</title>
  <link href="/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/fontawesome.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/commun.css">
  <link rel="stylesheet" href="/css/index.css">
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="logo-section">
        <div class="logo-circle"><i class="fas fa-mosque"></i></div>
        <h1>DMWM — Conseil UASZ</h1>
        <p>Moustarchidine Junior</p>
      </div>

      <div id="alerte" class="alert d-none" role="alert"></div>

      <form id="formLogin">
        <div class="mb-3">
          <label class="form-label"><i class="fas fa-user me-2"></i>Identifiant</label>
          <input type="text" class="form-control" id="identifiant" placeholder="Entrez votre identifiant" required aria-label="Identifiant">
        </div>
        <div class="mb-4">
          <label class="form-label"><i class="fas fa-lock me-2"></i>Mot de passe</label>
          <div class="input-group">
            <input type="password" class="form-control" id="mot_de_passe" placeholder="Entrez votre mot de passe" required aria-label="Mot de passe">
            <button class="btn btn-outline-secondary" type="button" id="toggleMdp">
              <i class="fas fa-eye" id="iconOeil"></i>
            </button>
          </div>
        </div>
        <button type="submit" class="btn-login" id="btnLogin">
          <i class="fas fa-sign-in-alt me-2"></i>Se connecter
        </button>
      </form>
    </div>
    <p class="footer-text">Dahiratoul Moustarchidina Wal Moustarchidaty © 2025</p>
  </div>

  <script src="/js-libs/bootstrap.bundle.min.js"></script>
  <script>
    document.getElementById('toggleMdp').addEventListener('click', () => {
      const input = document.getElementById('mot_de_passe');
      const icon = document.getElementById('iconOeil');
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'fas fa-eye-slash';
      } else {
        input.type = 'password';
        icon.className = 'fas fa-eye';
      }
    });

    function afficherAlerte(message, type) {
      const alerte = document.getElementById('alerte');
      alerte.className = `alert alert-${type}`;
      alerte.innerHTML = `<i class="fas fa-${type === 'danger' ? 'exclamation-circle' : 'check-circle'} me-2"></i>${message}`;
      alerte.classList.remove('d-none');
    }

    document.getElementById('formLogin').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnLogin');
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Connexion...';

      const identifiant = document.getElementById('identifiant').value.trim();
      const mot_de_passe = document.getElementById('mot_de_passe').value;

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ identifiant, mot_de_passe })
        });

        const data = await response.json();

        if (response.ok) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('utilisateur', JSON.stringify(data.utilisateur));
          afficherAlerte('Connexion réussie ! Redirection...', 'success');
          setTimeout(() => { window.location.href = '/dashboard.html'; }, 1000);
        } else {
          afficherAlerte(data.message, 'danger');
          btn.disabled = false;
          btn.innerHTML = '<i class="fas fa-sign-in-alt me-2"></i>Se connecter';
        }
      } catch (error) {
        afficherAlerte('Erreur de connexion au serveur.', 'danger');
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-sign-in-alt me-2"></i>Se connecter';
      }
    });

    if (localStorage.getItem('token')) {
      window.location.href = '/dashboard.html';
    }
  </script>
</body>
</html>
