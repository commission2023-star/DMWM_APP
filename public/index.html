<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DMWM — Conseil UASZ</title>
  <link href="/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/fontawesome.min.css" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #1B5E8A 0%, #0d3d5e 50%, #072a42 100%);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Segoe UI', sans-serif;
    }
    .login-container { width: 100%; max-width: 420px; padding: 20px; }
    .login-card {
      background: white; border-radius: 20px;
      padding: 40px 35px; box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .logo-section { text-align: center; margin-bottom: 30px; }
    .logo-circle {
      width: 80px; height: 80px; border-radius: 50%;
      background: linear-gradient(135deg, #1B5E8A, #2E75B6);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 15px;
    }
    .logo-circle i { color: white; font-size: 35px; }
    .logo-section h1 { color: #1B5E8A; font-size: 1.4rem; font-weight: 700; }
    .logo-section p { color: #777; font-size: 0.85rem; margin-top: 4px; }
    .form-label { font-weight: 600; color: #333; font-size: 0.9rem; }
    .form-control {
      border: 2px solid #e0e0e0; border-radius: 10px;
      padding: 12px 15px; font-size: 0.95rem; transition: all 0.3s;
    }
    .form-control:focus {
      border-color: #1B5E8A; box-shadow: 0 0 0 3px rgba(27,94,138,0.15);
    }
    .input-group .form-control { border-right: none; }
    .input-group .btn-outline-secondary {
      border: 2px solid #e0e0e0; border-left: none;
      border-radius: 0 10px 10px 0; background: white; color: #777;
    }
    .btn-login {
      background: linear-gradient(135deg, #1B5E8A, #2E75B6);
      border: none; border-radius: 10px; padding: 13px;
      font-size: 1rem; font-weight: 600; color: white;
      width: 100%; margin-top: 10px; transition: all 0.3s;
    }
    .btn-login:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(27,94,138,0.4); }
    .btn-login:disabled { opacity: 0.7; transform: none; }
    .alert { border-radius: 10px; font-size: 0.9rem; }
    .footer-text { text-align: center; color: #aaa; font-size: 0.78rem; margin-top: 20px; }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="logo-section">
        <div class="logo-circle"><i class="fas fa-mosque"></i></div>
        <h1>DMWM — Conseil UASZ</h1>
        <p>Moustarchidine Junior</p>
      </div>

      <div id="alerte" class="alert d-none" role="alert"></div>

      <form id="formLogin">
        <div class="mb-3">
          <label class="form-label"><i class="fas fa-user me-2"></i>Identifiant</label>
          <input type="text" class="form-control" id="identifiant" placeholder="Entrez votre identifiant" required aria-label="Identifiant">
        </div>
        <div class="mb-4">
          <label class="form-label"><i class="fas fa-lock me-2"></i>Mot de passe</label>
          <div class="input-group">
            <input type="password" class="form-control" id="mot_de_passe" placeholder="Entrez votre mot de passe" required aria-label="Mot de passe">
            <button class="btn btn-outline-secondary" type="button" id="toggleMdp">
              <i class="fas fa-eye" id="iconOeil"></i>
            </button>
          </div>
        </div>
        <button type="submit" class="btn-login" id="btnLogin">
          <i class="fas fa-sign-in-alt me-2"></i>Se connecter
        </button>
      </form>
    </div>
    <p class="footer-text">Dahiratoul Moustarchidina Wal Moustarchidaty © 2025</p>
  </div>

  <script src="/js-libs/bootstrap.bundle.min.js"></script>
  <script>
    document.getElementById('toggleMdp').addEventListener('click', () => {
      const input = document.getElementById('mot_de_passe');
      const icon = document.getElementById('iconOeil');
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'fas fa-eye-slash';
      } else {
        input.type = 'password';
        icon.className = 'fas fa-eye';
      }
    });

    function afficherAlerte(message, type) {
      const alerte = document.getElementById('alerte');
      alerte.className = `alert alert-${type}`;
      alerte.innerHTML = `<i class="fas fa-${type === 'danger' ? 'exclamation-circle' : 'check-circle'} me-2"></i>${message}`;
      alerte.classList.remove('d-none');
    }

    document.getElementById('formLogin').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnLogin');
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Connexion...';

      const identifiant = document.getElementById('identifiant').value.trim();
      const mot_de_passe = document.getElementById('mot_de_passe').value;

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ identifiant, mot_de_passe })
        });

        const data = await response.json();

        if (response.ok) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('utilisateur', JSON.stringify(data.utilisateur));
          afficherAlerte('Connexion réussie ! Redirection...', 'success');
          setTimeout(() => { window.location.href = '/dashboard.html'; }, 1000);
        } else {
          afficherAlerte(data.message, 'danger');
          btn.disabled = false;
          btn.innerHTML = '<i class="fas fa-sign-in-alt me-2"></i>Se connecter';
        }
      } catch (error) {
        afficherAlerte('Erreur de connexion au serveur.', 'danger');
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-sign-in-alt me-2"></i>Se connecter';
      }
    });

    if (localStorage.getItem('token')) {
      window.location.href = '/dashboard.html';
    }
  </script>
</body>
</html>
