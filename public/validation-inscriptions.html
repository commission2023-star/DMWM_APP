<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    try {
      var t = localStorage.getItem('dmwm-theme');
      document.documentElement.dataset.theme = t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    } catch (e) {}
  </script>
<title>Validation inscriptions — DMWM UASZ</title>
<link href="/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="/css/commun.css">
<link rel="stylesheet" href="/css/validation-inscriptions.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#6d28d9">
  <link rel="icon" type="image/png" href="/images/icon-192.png">
  <script src="/js/pwa.js" defer></script>
  <script src="/js-libs/lucide.min.js" defer></script>
  <script src="/js/icons.js" defer></script>
  <script src="/js/theme.js" defer></script>
</head>
<body>
<script src="/js/auth-guard.js"></script>
<script src="/js/sidebar.js"></script>

<div class="page-wrapper">
  <div class="topbar-page">
    <div class="d-flex align-items-center gap-3">
      <button class="btn-hamburger" onclick="toggleSidebar()" title="Ouvrir le menu" aria-label="Ouvrir le menu"><i data-lucide="menu" aria-hidden="true"></i></button>
      <h5><i class="me-2" data-lucide="clipboard-check" aria-hidden="true"></i>Validation des inscriptions</h5>
    </div>
    <a href="/inscription.html" target="_blank" class="btn btn-outline-primary btn-sm"><i class="me-1" data-lucide="external-link" aria-hidden="true"></i>Formulaire public</a>
  </div>

  <div class="page-contenu">
  <div class="row g-3 mb-4">
    <div class="col-6 col-md-3"><div class="stat-mini"><div class="stat-mini-icon" style="background:linear-gradient(135deg,#fbbf24,#f59e0b)"><i data-lucide="clock" aria-hidden="true"></i></div><div><div class="stat-mini-num" id="sEnAttente">—</div><div class="stat-mini-label">En attente</div></div></div></div>
    <div class="col-6 col-md-3"><div class="stat-mini"><div class="stat-mini-icon" style="background:linear-gradient(135deg,#10b981,#059669)"><i data-lucide="circle-check" aria-hidden="true"></i></div><div><div class="stat-mini-num" id="sValides">—</div><div class="stat-mini-label">Validées</div></div></div></div>
    <div class="col-6 col-md-3"><div class="stat-mini"><div class="stat-mini-icon" style="background:linear-gradient(135deg,#fb7185,#e11d48)"><i data-lucide="circle-x" aria-hidden="true"></i></div><div><div class="stat-mini-num" id="sRejetes">—</div><div class="stat-mini-label">Rejetées</div></div></div></div>
    <div class="col-6 col-md-3"><div class="stat-mini"><div class="stat-mini-icon" style="background:linear-gradient(135deg,#7c3aed,#4f46e5)"><i data-lucide="list" aria-hidden="true"></i></div><div><div class="stat-mini-num" id="sTotal">—</div><div class="stat-mini-label">Total</div></div></div></div>
  </div>

  <div class="card-custom">
    <div class="row g-2 align-items-end">
      <div class="col-md-4">
        <select class="form-select" id="filtreStatut" onchange="chargerInscriptions()" aria-label="En attente ⏳">
          <option value="En attente">En attente ⏳</option><option value="Valide">Validées ✅</option><option value="Rejete">Rejetées ❌</option><option value="">Toutes</option>
        </select>
      </div>
      <div class="col-md-4">
        <select class="form-select" id="filtreType" onchange="chargerInscriptions()" aria-label="Tous types">
          <option value="">Tous types</option><option value="Nouveau Bachelier">Nouveau Bachelier</option><option value="Nouveau Adherent">Nouveau Adhérent</option><option value="Ancien">Ancien</option>
        </select>
      </div>
    </div>
  </div>

  <div class="card-custom">
    <div id="alerte" class="alert d-none mb-3"></div>
    <div class="table-responsive">
      <table class="table table-hover">
        <thead><tr><th>#</th><th>Nom & Prénom</th><th>Type</th><th>Téléphone</th><th>Filière</th><th>Date soumission</th><th>Statut</th><th>Actions</th></tr></thead>
        <tbody id="tableInscriptions"><tr><td colspan="8" class="text-center text-muted py-4">Chargement...</td></tr></tbody>
      </table>
    </div>
  </div>
  </div>
</div>

<div class="modal fade" id="modalDetail" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content border-0 rounded-4">
      <div class="modal-header rounded-top-4"><h5 class="modal-title"><i class="me-2" data-lucide="user" aria-hidden="true"></i>Dossier d'inscription</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body p-4" id="contenuModal">Chargement...</div>
      <div class="modal-footer" id="footerModal"></div>
    </div>
  </div>
</div>

<div class="modal fade" id="modalRejet" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content border-0 rounded-4">
      <div class="modal-header rounded-top-4" style="background:linear-gradient(135deg,#fb7185,#e11d48);color:white;">
        <h5 class="modal-title"><i class="me-2" data-lucide="circle-x" aria-hidden="true"></i>Rejeter l'inscription</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body p-4">
        <input type="hidden" id="rejetId">
        <label class="form-label fw-bold">Motif du rejet</label>
        <textarea class="form-control" id="motifRejet" rows="3" aria-label="Motif du rejet"></textarea>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary rounded-3" data-bs-dismiss="modal">Annuler</button>
        <button class="btn btn-danger rounded-3" onclick="confirmerRejet()"><i class="me-2" data-lucide="x" aria-hidden="true"></i>Confirmer le rejet</button>
      </div>
    </div>
  </div>
</div>

<script src="/js-libs/bootstrap.bundle.min.js"></script>
<script>
  const token = window.authToken;
  const user = window.currentUser;
  if (!['Super Admin', 'Admin CA'].includes(user.role)) window.location.href = '/dashboard.html';

  const couleursType = { 'Nouveau Bachelier':'info', 'Nouveau Adherent':'primary', 'Ancien':'dark' };
  const couleursStatut = { 'En attente':'warning', 'Valide':'success', 'Rejete':'danger' };

function echapper(t) {
    return String(t ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function val(v) { return echapper(v || '—'); }
  function formatDate(d) { return d ? new Date(d).toLocaleDateString('fr-FR') : '—'; }
  function formatDateTime(d) { return d ? new Date(d).toLocaleString('fr-FR') : '—'; }
  function fichierLien(url, label) {
    if (!url || !/^https:\/\/res\.cloudinary\.com\//.test(String(url))) return '—';
    const sure = echapper(url);
    const extension = String(url).split('?')[0].split('.').pop().toLowerCase();
    if (extension === 'pdf') {
      return `<a href="${sure}" target="_blank" rel="noopener" class="btn btn-sm btn-outline-danger"><i class="me-1" data-lucide="file-text" aria-hidden="true"></i>${echapper(label)}</a>`;
    }
    return `<a href="${sure}" target="_blank" rel="noopener"><img src="${sure}" alt="${echapper(label)}" style="max-width:120px;max-height:120px;border-radius:8px;border:1px solid #eee;object-fit:cover"></a>`;
  }

  async function chargerStats() {
    try {
      const res = await fetch('/api/inscriptions/stats', { headers: { Authorization: `Bearer ${token}` } });
      const d = await res.json();
      document.getElementById('sEnAttente').textContent = d.enAttente;
      document.getElementById('sValides').textContent = d.valides;
      document.getElementById('sRejetes').textContent = d.rejetes;
      document.getElementById('sTotal').textContent = d.total;
    } catch(e) {}
  }

  async function chargerInscriptions() {
    try {
      const statut = document.getElementById('filtreStatut').value;
      const type = document.getElementById('filtreType').value;
      const params = new URLSearchParams();
      if (statut) params.append('statut', statut);
      if (type) params.append('type_formulaire', type);

      const res = await fetch(`/api/inscriptions?${params}`, { headers: { Authorization: `Bearer ${token}` } });
      const inscriptions = await res.json();
      const tbody = document.getElementById('tableInscriptions');

      if (inscriptions.length === 0) { tbody.innerHTML = '<tr><td colspan="8" class="text-center text-muted py-4">Aucune inscription trouvée</td></tr>'; return; }

      tbody.innerHTML = inscriptions.map((ins, i) => {
        const d = ins.donnees;
        return `<tr>
          <td class="text-muted">${i+1}</td>
          <td><strong>${val(d.prenom)} ${val(d.nom)}</strong></td>
          <td><span class="badge bg-${couleursType[ins.type_formulaire]||'secondary'}" style="font-size:0.72rem">${ins.type_formulaire}</span></td>
          <td>${val(d.telephone)}</td><td>${val(d.filiere)}</td><td>${formatDateTime(ins.created_at)}</td>
          <td><span class="badge bg-${couleursStatut[ins.statut]||'secondary'}">${ins.statut}</span></td>
          <td>
            <button class="btn btn-sm btn-outline-info me-1" onclick="voirDetail(${ins.id})" title="Voir le détail" aria-label="Voir le détail"><i data-lucide="eye" aria-hidden="true"></i></button>
            ${ins.statut === 'En attente' ? `
              <button class="btn btn-sm btn-outline-success me-1" onclick="validerInscription(${ins.id})" title="Valider le dossier" aria-label="Valider le dossier"><i data-lucide="check" aria-hidden="true"></i></button>
              <button class="btn btn-sm btn-outline-danger" onclick="ouvrirRejet(${ins.id})" title="Rejeter le dossier" aria-label="Rejeter le dossier"><i data-lucide="x" aria-hidden="true"></i></button>
            ` : ''}
          </td>
        </tr>`;
      }).join('');
    } catch(e) { afficherAlerte('Erreur lors du chargement.', 'danger'); }
  }

  async function voirDetail(id) {
    try {
      const res = await fetch(`/api/inscriptions/${id}`, { headers: { Authorization: `Bearer ${token}` } });
      const ins = await res.json();
      const d = ins.donnees;

      let html = `
        <div class="section-modal"><i class="me-2" data-lucide="id-card" aria-hidden="true"></i>Informations personnelles</div>
        <div class="row">
          <div class="col-md-6">
            <div class="info-ligne"><span class="info-cle">Nom complet</span><span class="info-val">${val(d.prenom)} ${val(d.nom)}</span></div>
            <div class="info-ligne"><span class="info-cle">Genre</span><span class="info-val">${d.sexe==='H'?'Homme':'Femme'}</span></div>
            <div class="info-ligne"><span class="info-cle">Date naissance</span><span class="info-val">${formatDate(d.date_naissance)}</span></div>
            <div class="info-ligne"><span class="info-cle">Lieu naissance</span><span class="info-val">${val(d.lieu_naissance)}</span></div>
          </div>
          <div class="col-md-6">
            <div class="info-ligne"><span class="info-cle">Téléphone</span><span class="info-val">${val(d.telephone)}</span></div>
            <div class="info-ligne"><span class="info-cle">Email</span><span class="info-val">${val(d.email)}</span></div>
            <div class="info-ligne"><span class="info-cle">Adresse</span><span class="info-val">${val(d.adresse)}</span></div>
          </div>
        </div>
        <div class="section-modal"><i class="me-2" data-lucide="shield-user" aria-hidden="true"></i>Tuteur</div>
        <div class="info-ligne"><span class="info-cle">Nom tuteur</span><span class="info-val">${val(d.tuteur_nom)}</span></div>
        <div class="info-ligne"><span class="info-cle">Tél. tuteur</span><span class="info-val">${val(d.tuteur_telephone)}</span></div>
        <div class="section-modal"><i class="me-2" data-lucide="graduation-cap" aria-hidden="true"></i>Université</div>
        <div class="info-ligne"><span class="info-cle">Filière</span><span class="info-val">${val(d.filiere)}</span></div>
        <div class="info-ligne"><span class="info-cle">Niveau</span><span class="info-val">${val(d.niveau)}</span></div>
        <div class="section-modal"><i class="me-2" data-lucide="map-pin" aria-hidden="true"></i>Origine géographique</div>
        <div class="info-ligne"><span class="info-cle">Région</span><span class="info-val">${val(d.region_origine)}</span></div>
        <div class="info-ligne"><span class="info-cle">Département</span><span class="info-val">${val(d.departement)}</span></div>
        <div class="info-ligne"><span class="info-cle">Arrondissement</span><span class="info-val">${val(d.arrondissement)}</span></div>
        <div class="info-ligne"><span class="info-cle">Commune</span><span class="info-val">${val(d.commune)}</span></div>
      `;

      if (ins.type_formulaire !== 'Nouveau Adherent') {
        html += `
          <div class="section-modal"><i class="me-2" data-lucide="landmark" aria-hidden="true"></i>Origine dans le mouvement</div>
          <div class="info-ligne"><span class="info-cle">Comité / Axe</span><span class="info-val">${val(d.comite_origine)}</span></div>
          <div class="info-ligne"><span class="info-cle">Conseil</span><span class="info-val">${val(d.conseil_origine)}</span></div>
          <div class="info-ligne"><span class="info-cle">Section de base</span><span class="info-val">${val(d.section_base)}</span></div>
          <div class="info-ligne"><span class="info-cle">Poste</span><span class="info-val">${val(d.poste_section_base)}</span></div>
          <div class="info-ligne"><span class="info-cle">PF / Président</span><span class="info-val">${val(d.pf_nom)}</span></div>
          <div class="info-ligne"><span class="info-cle">Tél. PF</span><span class="info-val">${val(d.pf_telephone)}</span></div>
        `;
      }

      if (d.photo_profil || d.document_identite) {
        html += `
          <div class="section-modal"><i class="me-2" data-lucide="file-image" aria-hidden="true"></i>Photo et documents</div>
          <div class="row">
            <div class="col-md-6"><div class="info-ligne"><span class="info-cle">Photo de profil</span><span class="info-val">${fichierLien(d.photo_profil, 'Voir la photo')}</span></div></div>
            <div class="col-md-6"><div class="info-ligne"><span class="info-cle">Carte d'identité</span><span class="info-val">${fichierLien(d.document_identite, 'Voir le document')}</span></div></div>
          </div>
        `;
      }

      if (ins.statut === 'Rejete' && ins.motif_rejet) html += `<div class="alert alert-danger mt-3"><strong>Motif du rejet :</strong> ${echapper(ins.motif_rejet)}</div>`;

      document.getElementById('contenuModal').innerHTML = html;

      const footer = document.getElementById('footerModal');
      if (ins.statut === 'En attente') {
        footer.innerHTML = `
          <button class="btn btn-secondary rounded-3" data-bs-dismiss="modal">Fermer</button>
          <button class="btn btn-danger rounded-3" onclick="ouvrirRejet(${ins.id}); bootstrap.Modal.getInstance(document.getElementById('modalDetail')).hide();"><i class="me-2" data-lucide="x" aria-hidden="true"></i>Rejeter</button>
          <button class="btn btn-success rounded-3" onclick="validerInscription(${ins.id}); bootstrap.Modal.getInstance(document.getElementById('modalDetail')).hide();"><i class="me-2" data-lucide="check" aria-hidden="true"></i>Valider</button>
        `;
      } else { footer.innerHTML = `<button class="btn btn-secondary rounded-3" data-bs-dismiss="modal">Fermer</button>`; }

      new bootstrap.Modal(document.getElementById('modalDetail')).show();
    } catch(e) { afficherAlerte('Erreur lors du chargement du dossier.', 'danger'); }
  }

  async function validerInscription(id) {
    if (!confirm('Valider ce dossier ? Le membre sera ajouté à la base de données.')) return;
    try {
      const res = await fetch(`/api/inscriptions/${id}/valider`, { method:'PATCH', headers:{ Authorization:`Bearer ${token}` } });
      const data = await res.json();
      if (res.ok) { afficherAlerte(data.message, 'success'); chargerInscriptions(); chargerStats(); }
      else { afficherAlerte(data.message, 'danger'); }
    } catch(e) { afficherAlerte('Erreur serveur.', 'danger'); }
  }

  function ouvrirRejet(id) {
    document.getElementById('rejetId').value = id;
    document.getElementById('motifRejet').value = '';
    new bootstrap.Modal(document.getElementById('modalRejet')).show();
  }

  async function confirmerRejet() {
    const id = document.getElementById('rejetId').value;
    const motif = document.getElementById('motifRejet').value.trim();
    if (!motif) { alert('Veuillez préciser un motif de rejet.'); return; }
    try {
      const res = await fetch(`/api/inscriptions/${id}/rejeter`, { method:'PATCH', headers:{ Authorization:`Bearer ${token}`,'Content-Type':'application/json' }, body: JSON.stringify({ motif_rejet: motif }) });
      if (res.ok) { bootstrap.Modal.getInstance(document.getElementById('modalRejet')).hide(); afficherAlerte('Inscription rejetée.', 'warning'); chargerInscriptions(); chargerStats(); }
    } catch(e) { afficherAlerte('Erreur serveur.', 'danger'); }
  }

  function afficherAlerte(msg, type) {
    const a = document.getElementById('alerte');
    a.className = `alert alert-${type}`;
    a.innerHTML = `<i data-lucide="${type==='success'?'circle-check':'circle-alert'}"></i><span>${msg}</span>`;
    a.classList.remove('d-none'); setTimeout(() => a.classList.add('d-none'), 5000);
  }

  chargerStats(); chargerInscriptions();
</script>
</body>
</html>
