<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon profil — DMWM UASZ</title>
<link href="/css/bootstrap.min.css" rel="stylesheet">
<link href="/css/fontawesome.min.css" rel="stylesheet">
<link rel="stylesheet" href="/css/commun.css">
<link rel="stylesheet" href="/css/profil.css">
</head>
<body>
<script src="/js/auth-guard.js"></script>
<script src="/js/sidebar.js"></script>

<div class="page-wrapper">
  <div class="topbar-page">
    <div class="d-flex align-items-center gap-3">
      <button class="btn-hamburger" onclick="toggleSidebar()" title="Ouvrir le menu" aria-label="Ouvrir le menu"><i class="fas fa-bars"></i></button>
      <h5><i class="fas fa-user-circle me-2"></i>Mon profil</h5>
    </div>
  </div>

  <div style="padding:25px;flex:1;">
  <div class="card-custom text-center">
    <div class="avatar-large" id="avatarInitiale">?</div>
    <h5 class="fw-bold" id="profilNom">Chargement...</h5>
    <span class="badge bg-primary" id="profilRole"></span>
    <p class="text-muted mt-2 mb-0" id="profilIdentifiant"></p>
  </div>

  <div class="card-custom">
    <h6 class="fw-bold text-primary mb-4"><i class="fas fa-lock me-2"></i>Changer le mot de passe</h6>
    <div id="alerte" class="alert d-none mb-3"></div>
    <div class="mb-3"><label class="form-label fw-bold">Ancien mot de passe</label><input type="password" class="form-control" id="ancienMdp" aria-label="Ancien mot de passe"></div>
    <div class="mb-3"><label class="form-label fw-bold">Nouveau mot de passe</label><input type="password" class="form-control" id="nouveauMdp" aria-label="Nouveau mot de passe"></div>
    <div class="mb-4"><label class="form-label fw-bold">Confirmer le nouveau mot de passe</label><input type="password" class="form-control" id="confirmerMdp" aria-label="Confirmer le nouveau mot de passe"></div>
    <button class="btn btn-save" onclick="changerMotDePasse()"><i class="fas fa-save me-2"></i>Enregistrer le nouveau mot de passe</button>
  </div>
  </div>
</div>

<script src="/js-libs/bootstrap.bundle.min.js"></script>
<script>
  const token = window.authToken;
  const utilisateur = window.currentUser;

  document.getElementById('profilNom').textContent = utilisateur.nom || '';
  document.getElementById('profilRole').textContent = utilisateur.role || '';
  document.getElementById('profilIdentifiant').textContent = '@' + (utilisateur.identifiant || '');
  document.getElementById('avatarInitiale').textContent = (utilisateur.nom || '?')[0].toUpperCase();

  async function changerMotDePasse() {
    const ancien = document.getElementById('ancienMdp').value;
    const nouveau = document.getElementById('nouveauMdp').value;
    const confirmer = document.getElementById('confirmerMdp').value;

    if (!ancien || !nouveau || !confirmer) { afficherAlerte('Tous les champs sont obligatoires.', 'danger'); return; }
    if (nouveau.length < 6) { afficherAlerte('Le nouveau mot de passe doit faire au moins 6 caractères.', 'danger'); return; }
    if (nouveau !== confirmer) { afficherAlerte('Les mots de passe ne correspondent pas.', 'danger'); return; }

    try {
      const res = await fetch('/api/auth/changer-mot-de-passe', { method:'PUT', headers:{ Authorization:`Bearer ${token}`,'Content-Type':'application/json' }, body: JSON.stringify({ ancien_mot_de_passe: ancien, nouveau_mot_de_passe: nouveau }) });
      const data = await res.json();
      if (res.ok) {
        afficherAlerte('Mot de passe modifié avec succès !', 'success');
        document.getElementById('ancienMdp').value = ''; document.getElementById('nouveauMdp').value = ''; document.getElementById('confirmerMdp').value = '';
      } else { afficherAlerte(data.message, 'danger'); }
    } catch(e) { afficherAlerte('Erreur serveur.', 'danger'); }
  }

  function afficherAlerte(msg, type) {
    const a = document.getElementById('alerte');
    a.className = `alert alert-${type}`;
    a.innerHTML = `<i class="fas fa-${type==='success'?'check':'exclamation'}-circle me-2"></i>${msg}`;
    a.classList.remove('d-none'); setTimeout(() => a.classList.add('d-none'), 4000);
  }
</script>
</body>
</html>
