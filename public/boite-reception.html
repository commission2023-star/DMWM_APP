<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    try {
      var t = localStorage.getItem('dmwm-theme');
      document.documentElement.dataset.theme = t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    } catch (e) {}
  </script>
<title>Boîte de réception — DMWM UASZ</title>
<link rel="stylesheet" href="/css/bootstrap.min.css">
<link rel="stylesheet" href="/css/commun.css">
<link rel="stylesheet" href="/css/boite-reception.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#6d28d9">
  <link rel="icon" type="image/png" href="/images/icon-192.png">
  <script src="/js/pwa.js" defer></script>
  <script src="/js-libs/lucide.min.js" defer></script>
  <script src="/js/icons.js" defer></script>
  <script src="/js/theme.js" defer></script>
</head>
<body>
<script src="/js/auth-guard.js"></script>
<script src="/js/sidebar.js"></script>

<div class="page-wrapper">
  <div class="topbar-page">
    <div class="d-flex align-items-center gap-3">
      <button class="btn-hamburger" onclick="toggleSidebar()" title="Ouvrir le menu" aria-label="Ouvrir le menu"><i data-lucide="menu" aria-hidden="true"></i></button>
      <h5><i class="me-2" data-lucide="inbox" aria-hidden="true"></i>Boîte de réception</h5>
    </div>
  </div>

  <div class="page-contenu">
  <div id="alerte" class="alert d-none mb-3"></div>

  <div class="row g-3 mb-4">
    <div class="col-6 col-md-4"><div class="stat-mini"><div class="stat-mini-icon" style="background:linear-gradient(135deg,#fbbf24,#f59e0b)"><i data-lucide="mail" aria-hidden="true"></i></div><div><div class="stat-mini-num" id="sEnAttente">—</div><div class="stat-mini-label">En attente</div></div></div></div>
    <div class="col-6 col-md-4"><div class="stat-mini"><div class="stat-mini-icon" style="background:linear-gradient(135deg,#10b981,#059669)"><i data-lucide="circle-check" aria-hidden="true"></i></div><div><div class="stat-mini-num" id="sTraites">—</div><div class="stat-mini-label">Traités</div></div></div></div>
    <div class="col-6 col-md-4"><div class="stat-mini"><div class="stat-mini-icon" style="background:linear-gradient(135deg,#7c3aed,#4f46e5)"><i data-lucide="inbox" aria-hidden="true"></i></div><div><div class="stat-mini-num" id="sTotal">—</div><div class="stat-mini-label">Total</div></div></div></div>
  </div>

  <div class="card-custom">
    <div class="row g-2">
      <div class="col-md-4"><select class="form-select" id="filtreStatut" onchange="chargerMessages()" aria-label="Tous"><option value="">Tous</option><option value="En attente">En attente</option><option value="Traite">Traités</option></select></div>
      <div class="col-md-4"><select class="form-select" id="filtreCommission" onchange="chargerMessages()" aria-label="Toutes commissions"><option value="">Toutes commissions</option><option value="PF">PF</option><option value="CIPS">CIPS</option><option value="CTC">CTC</option><option value="CL">CL</option></select></div>
      <div class="col-md-4"><button class="btn btn-outline-secondary w-100" onclick="reinitialiserFiltres()"><i class="me-1" data-lucide="rotate-cw" aria-hidden="true"></i>Réinitialiser</button></div>
    </div>
  </div>

  <div id="listeMessages"><div class="text-center text-muted py-4">Chargement...</div></div>
  </div>
</div>

<div class="modal fade" id="modalMessage" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content border-0 rounded-4">
      <div class="modal-header rounded-top-4"><h5 class="modal-title"><i class="me-2" data-lucide="mail-open" aria-hidden="true"></i>Détail du message</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body p-4" id="contenuModal"></div>
      <div class="modal-footer" id="footerModal"></div>
    </div>
  </div>
</div>

<script src="/js-libs/bootstrap.bundle.min.js"></script>
<script>
  const token = window.authToken;
  const user = window.currentUser;
  const couleursCommission = { 'PF':'warning','Admin CA':'primary','CIPS':'info','CTC':'success','CL':'dark','Super Admin':'danger' };

  function formatDateTime(d) { if (!d) return '—'; return new Date(d).toLocaleString('fr-FR'); }

  async function chargerStats() {
    try {
      const res = await fetch('/api/messages/stats', { headers: { Authorization: `Bearer ${token}` } });
      const d = await res.json();
      document.getElementById('sEnAttente').textContent = d.enAttente;
      document.getElementById('sTraites').textContent = d.traites;
      document.getElementById('sTotal').textContent = d.total;
    } catch(e) {}
  }

  async function chargerMessages() {
    try {
      const statut = document.getElementById('filtreStatut').value;
      const commission = document.getElementById('filtreCommission').value;
      const params = new URLSearchParams();
      if (statut) params.append('statut', statut);
      if (commission) params.append('commission', commission);

      const res = await fetch(`/api/messages?${params}`, { headers: { Authorization: `Bearer ${token}` } });
      const messages = await res.json();
      const container = document.getElementById('listeMessages');

      if (messages.length === 0) { container.innerHTML = `<div class="text-center py-5"><i class="text-muted mb-3 icon-xl" data-lucide="inbox" aria-hidden="true"></i><p class="text-muted">Aucun message trouvé</p></div>`; return; }

      container.innerHTML = messages.map(m => `
        <div class="message-card ${m.statut==='En attente'?'non-lu':'traite'}" onclick="voirMessage(${m.id})">
          <div class="d-flex justify-content-between align-items-start flex-wrap gap-2">
            <div><span class="badge badge-commission bg-${couleursCommission[m.commission]||'secondary'} me-2">${m.commission}</span><strong>${m.objet}</strong></div>
            <div class="d-flex gap-2 align-items-center"><span class="badge bg-${m.statut==='En attente'?'warning':'success'}">${m.statut}</span><small class="text-muted">${formatDateTime(m.created_at)}</small></div>
          </div>
          <div class="text-muted mt-2" style="font-size:0.85rem;"><i class="me-1" data-lucide="user" aria-hidden="true"></i>${m.Utilisateur?.nom||'Inconnu'}${m.fichier_joint ? ' · <i class="me-1" data-lucide="paperclip" aria-hidden="true"></i>Fichier joint' : ''}</div>
          ${m.contenu ? `<div class="mt-2" style="font-size:0.83rem;color:#555;overflow:hidden;max-height:40px;text-overflow:ellipsis;">${m.contenu.substring(0,120)}${m.contenu.length>120?'...':''}</div>` : ''}
        </div>`).join('');
    } catch(e) { afficherAlerte('Erreur lors du chargement.', 'danger'); }
  }

  async function voirMessage(id) {
    try {
      const res = await fetch(`/api/messages/${id}`, { headers: { Authorization: `Bearer ${token}` } });
      const m = await res.json();
      document.getElementById('contenuModal').innerHTML = `
        <div class="mb-3"><span class="badge bg-${couleursCommission[m.commission]||'secondary'} me-2">${m.commission}</span><span class="badge bg-${m.statut==='En attente'?'warning':'success'}">${m.statut}</span></div>
        <h5 class="fw-bold">${m.objet}</h5>
        <div class="text-muted small mb-3"><i class="me-1" data-lucide="user" aria-hidden="true"></i>${m.Utilisateur?.nom||'Inconnu'} &nbsp;·&nbsp; <i class="me-1" data-lucide="clock" aria-hidden="true"></i>${formatDateTime(m.created_at)}</div>
        ${m.contenu ? `<div class="p-3 bg-light rounded-3 mb-3" style="white-space:pre-wrap;">${m.contenu}</div>` : ''}
        ${m.fichier_joint ? `<div class="mt-3"><strong><i class="me-2" data-lucide="paperclip" aria-hidden="true"></i>Fichier joint :</strong><a href="${m.fichier_joint}" target="_blank" class="btn btn-outline-primary btn-sm ms-2"><i class="me-1" data-lucide="download" aria-hidden="true"></i>Télécharger</a></div>` : ''}`;

      document.getElementById('footerModal').innerHTML = `
        <button class="btn btn-secondary rounded-3" data-bs-dismiss="modal">Fermer</button>
        ${m.statut==='En attente' && ['Super Admin','Admin CA'].includes(user.role) ? `<button class="btn btn-success rounded-3" onclick="marquerTraite(${m.id})"><i class="me-2" data-lucide="check" aria-hidden="true"></i>Marquer comme traité</button>` : ''}`;

      new bootstrap.Modal(document.getElementById('modalMessage')).show();
    } catch(e) { afficherAlerte('Erreur lors du chargement.', 'danger'); }
  }

  async function marquerTraite(id) {
    try {
      const res = await fetch(`/api/messages/${id}/statut`, { method:'PATCH', headers:{ Authorization:`Bearer ${token}`,'Content-Type':'application/json' }, body: JSON.stringify({ statut: 'Traite' }) });
      if (res.ok) { bootstrap.Modal.getInstance(document.getElementById('modalMessage')).hide(); afficherAlerte('Message marqué comme traité.', 'success'); chargerMessages(); chargerStats(); }
    } catch(e) { afficherAlerte('Erreur serveur.', 'danger'); }
  }

  function reinitialiserFiltres() { document.getElementById('filtreStatut').value=''; document.getElementById('filtreCommission').value=''; chargerMessages(); }

  function afficherAlerte(msg, type) {
    const a = document.getElementById('alerte');
    a.className = `alert alert-${type}`; a.innerHTML = `<i data-lucide="${type==='success'?'circle-check':'circle-alert'}"></i><span>${msg}</span>`;
    a.classList.remove('d-none'); setTimeout(() => a.classList.add('d-none'), 4000);
  }

  chargerStats(); chargerMessages();
</script>
</body>
</html>
