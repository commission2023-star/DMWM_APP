<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Membres — DMWM UASZ</title>
  <link href="/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/fontawesome.min.css" rel="stylesheet">
<link rel="stylesheet" href="/css/commun.css">
<link rel="stylesheet" href="/css/membres.css">
</head>
<body>
<script src="/js/auth-guard.js"></script>
<script src="/js/sidebar.js"></script>
<script src="/js/labels.js"></script>

<div class="page-wrapper">
  <div class="topbar-page">
    <div class="d-flex align-items-center gap-3">
      <button class="btn-hamburger" onclick="toggleSidebar()" title="Ouvrir le menu" aria-label="Ouvrir le menu"><i class="fas fa-bars"></i></button>
      <h5><i class="fas fa-users me-2"></i>Gestion des membres</h5>
    </div>
    <a href="/membre-form.html" class="btn btn-primary btn-sm"><i class="fas fa-plus me-1"></i>Nouveau membre</a>
  </div>

  <div style="padding:25px;flex:1;">

    <div class="row g-3 mb-4">
      <div class="col-6 col-md-3">
        <div class="stat-mini">
          <div class="stat-mini-icon" style="background:linear-gradient(135deg,#1B5E8A,#2E75B6)"><i class="fas fa-users"></i></div>
          <div><div class="stat-mini-num" id="sTotal">—</div><div class="stat-mini-label">Total actifs</div></div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="stat-mini">
          <div class="stat-mini-icon" style="background:linear-gradient(135deg,#28a745,#20c997)"><i class="fas fa-user-plus"></i></div>
          <div><div class="stat-mini-num" id="sNouveaux">—</div><div class="stat-mini-label">Nouveaux</div></div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="stat-mini">
          <div class="stat-mini-icon" style="background:linear-gradient(135deg,#2196F3,#64B5F6)"><i class="fas fa-mars"></i></div>
          <div><div class="stat-mini-num" id="sHommes">—</div><div class="stat-mini-label">Hommes</div></div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="stat-mini">
          <div class="stat-mini-icon" style="background:linear-gradient(135deg,#e91e63,#f48fb1)"><i class="fas fa-venus"></i></div>
          <div><div class="stat-mini-num" id="sFemmes">—</div><div class="stat-mini-label">Femmes</div></div>
        </div>
      </div>
    </div>

    <div class="card-custom mb-4">
      <div class="row g-2 align-items-end">
        <div class="col-md-4"><input type="text" class="form-control" id="recherche" placeholder="🔍 Rechercher par nom, téléphone, filière..." aria-label="Rechercher par nom, téléphone, filière"></div>
        <div class="col-6 col-md-2">
          <select class="form-select" id="filtreStatut" aria-label="Tous statuts">
            <option value="">Tous statuts</option>
            <option value="Nouveau">Nouveau</option>
            <option value="Confirme">Confirmé</option>
            <option value="Inactif">Inactif</option>
          </select>
        </div>
        <div class="col-6 col-md-2">
          <select class="form-select" id="filtreSexe" aria-label="H + F">
            <option value="">H + F</option>
            <option value="H">Hommes</option>
            <option value="F">Femmes</option>
          </select>
        </div>
        <div class="col-6 col-md-2">
          <select class="form-select" id="filtreCommission" aria-label="Toutes commissions">
            <option value="">Toutes commissions</option>
            <option value="PF">PF</option>
            <option value="CA">CA</option>
            <option value="CIPS">CIPS</option>
            <option value="CTC">CTC</option>
            <option value="CL">CL</option>
            <option value="Membre simple">Membres simples</option>
          </select>
        </div>
        <div class="col-6 col-md-2">
          <button class="btn btn-outline-secondary w-100" onclick="reinitialiserFiltres()"><i class="fas fa-redo me-1"></i>Réinitialiser</button>
        </div>
      </div>
    </div>

    <div class="card-custom">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h6 class="fw-bold text-primary mb-0"><i class="fas fa-list me-2"></i>Liste des membres <span class="badge bg-secondary ms-2" id="compteur">0</span></h6>
      </div>
      <div id="alerte" class="alert d-none mb-3"></div>
      <div class="table-responsive">
        <table class="table table-hover">
          <thead>
            <tr><th>#</th><th>Membre</th><th>Téléphone</th><th>Filière / Niveau</th><th>Commission</th><th>Catégorie</th><th>Statut</th><th>Actions</th></tr>
          </thead>
          <tbody id="tableMembres"><tr><td colspan="8" class="text-center text-muted py-4">Chargement...</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script src="/js-libs/bootstrap.bundle.min.js"></script>
<script>
  const token = window.authToken;
  let tousLesMembres = [];

  const couleursStatut = { 'Nouveau': 'warning', 'Confirme': 'success', 'Inactif': 'secondary' };
  const couleursCategorie = { 'Nouveau Bachelier': 'info', 'Nouveau Adherent': 'primary', 'Ancien': 'dark' };
  const couleursCommission = { 'PF': 'warning', 'CA': 'primary', 'CIPS': 'info', 'CTC': 'success', 'CL': 'dark', 'Membre simple': 'secondary' };

  async function chargerStats() {
    try {
      const res = await fetch('/api/membres/stats', { headers: { Authorization: `Bearer ${token}` } });
      const d = await res.json();
      document.getElementById('sTotal').textContent = d.total;
      document.getElementById('sNouveaux').textContent = d.nouveaux;
      document.getElementById('sHommes').textContent = d.hommes;
      document.getElementById('sFemmes').textContent = d.femmes;
    } catch(e) {}
  }

  async function chargerMembres() {
    try {
      const params = new URLSearchParams();
      const q = document.getElementById('recherche').value.trim();
      const statut = document.getElementById('filtreStatut').value;
      const sexe = document.getElementById('filtreSexe').value;
      const commission = document.getElementById('filtreCommission').value;
      if (q) params.append('q', q);
      if (statut) params.append('statut', statut);
      if (sexe) params.append('sexe', sexe);
      if (commission) params.append('commission', commission);

      const res = await fetch(`/api/membres?${params}`, { headers: { Authorization: `Bearer ${token}` } });
      tousLesMembres = await res.json();
      afficherMembres(tousLesMembres);
    } catch(e) {
      afficherAlerte('Erreur lors du chargement.', 'danger');
    }
  }

  function afficherMembres(liste) {
    document.getElementById('compteur').textContent = liste.length;
    const tbody = document.getElementById('tableMembres');
    if (liste.length === 0) {
      tbody.innerHTML = '<tr><td colspan="8" class="text-center text-muted py-4">Aucun membre trouvé</td></tr>';
      return;
    }
    tbody.innerHTML = liste.map((m, i) => `
      <tr>
        <td class="text-muted">${i + 1}</td>
        <td>
          <div class="d-flex align-items-center gap-2">
            <div class="avatar-sm">${m.prenom[0]}${m.nom[0]}</div>
            <div><div class="fw-bold">${m.prenom} ${m.nom}</div><small class="text-muted">${m.sexe === 'H' ? '♂ Homme' : '♀ Femme'}</small></div>
          </div>
        </td>
        <td>${m.telephone || '<span class="text-muted">—</span>'}</td>
        <td>${m.filiere || '—'} ${m.niveau ? `<br><small class="text-muted">${m.niveau}</small>` : ''}</td>
        <td><span class="badge bg-${couleursCommission[m.commission] || 'secondary'}">${m.commission}</span></td>
        <td><span class="badge bg-${couleursCategorie[m.categorie] || 'secondary'}" style="font-size:0.7rem">${labelCategorie(m.categorie)}</span></td>
        <td><span class="badge bg-${couleursStatut[m.statut] || 'secondary'}">${labelStatut(m.statut)}</span></td>
        <td>
          <a href="/membre-form.html?id=${m.id}" class="btn btn-sm btn-outline-primary me-1" title="Modifier" aria-label="Modifier"><i class="fas fa-edit"></i></a>
          <a href="/membre-detail.html?id=${m.id}" class="btn btn-sm btn-outline-info me-1" title="Détail" aria-label="Détail"><i class="fas fa-eye"></i></a>
          ${m.statut !== 'Inactif' ? `<button class="btn btn-sm btn-outline-danger" onclick="archiverMembre(${m.id}, '${m.prenom} ${m.nom}')" title="Archiver" aria-label="Archiver"><i class="fas fa-archive"></i></button>` : ''}
        </td>
      </tr>
    `).join('');
  }

  async function archiverMembre(id, nom) {
    if (!confirm(`Archiver ${nom} ? Il ne sera plus visible dans la liste active.`)) return;
    try {
      const res = await fetch(`/api/membres/${id}/archiver`, { method: 'PATCH', headers: { Authorization: `Bearer ${token}` } });
      if (res.ok) {
        afficherAlerte(`${nom} archivé avec succès.`, 'success');
        chargerMembres(); chargerStats();
      }
    } catch(e) { afficherAlerte('Erreur serveur.', 'danger'); }
  }

  function reinitialiserFiltres() {
    document.getElementById('recherche').value = '';
    document.getElementById('filtreStatut').value = '';
    document.getElementById('filtreSexe').value = '';
    document.getElementById('filtreCommission').value = '';
    chargerMembres();
  }

  function afficherAlerte(msg, type) {
    const a = document.getElementById('alerte');
    a.className = `alert alert-${type}`;
    a.innerHTML = `<i class="fas fa-${type==='success'?'check':'exclamation'}-circle me-2"></i>${msg}`;
    a.classList.remove('d-none');
    setTimeout(() => a.classList.add('d-none'), 4000);
  }

  document.getElementById('recherche').addEventListener('input', chargerMembres);
  document.getElementById('filtreStatut').addEventListener('change', chargerMembres);
  document.getElementById('filtreSexe').addEventListener('change', chargerMembres);
  document.getElementById('filtreCommission').addEventListener('change', chargerMembres);

  chargerStats();
  chargerMembres();
</script>
</body>
</html>
